name: Traffic MLOps Pipeline

on:
  schedule:
    - cron: "0 0 * * *"   # daily midnight run
  push:
    paths:
      - "data/**"

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - uses: actions/setup-python@v2
      with:
        python-version: "3.9"

    - name: Install deps
      run: pip install -r requirements.txt

    - name: Run drift monitor
      run: python monitoring/drift_check.py
