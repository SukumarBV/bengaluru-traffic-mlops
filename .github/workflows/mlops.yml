name: Traffic MLOps Pipeline

on:
  push:
    paths:
      - "data/**"
      - "training/**"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Retrain Model
      run: |
        python training/train.py
